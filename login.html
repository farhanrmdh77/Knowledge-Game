<!DOCTYPE html>
<html class="dark" lang="id">
<head>
    <style>html, body { background-color: #13131b !important; visibility: visible !important; }</style>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Masuk / Daftar - Knowledge Game</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Be+Vietnam+Pro:wght@400;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <style>
        body { background-color: #12121A; color: #e4e1ed; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass-card { background: rgba(35, 35, 52, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="p-4">

    <div class="glass-card p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 id="form-title" class="text-3xl font-extrabold text-white">Selamat Datang</h1>
            <p id="form-subtitle" class="text-sm text-[#c8c4d7]">Masuk untuk melanjutkan permainan</p>
        </div>

        <!-- Form Input -->
        <form id="auth-form" class="space-y-4">
            <div id="username-field" class="space-y-1 hidden">
                <label class="text-xs font-mono text-[#c6bfff]">NAMA PENGGUNA</label>
                <input type="text" id="username" class="w-full bg-[#1b1b23] border border-[#34343d] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#2edcd7]" placeholder="Nama panggilan...">
            </div>
            
            <div class="space-y-1">
                <label class="text-xs font-mono text-[#c6bfff]">EMAIL</label>
                <input type="email" id="email" required class="w-full bg-[#1b1b23] border border-[#34343d] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#2edcd7]" placeholder="nama@email.com">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-mono text-[#c6bfff]">PASSWORD</label>
                <input type="password" id="password" required class="w-full bg-[#1b1b23] border border-[#34343d] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#2edcd7]" placeholder="••••••••">
            </div>

            <!-- Bagian Pilih Avatar (Hanya muncul saat Daftar) -->
            <div id="avatar-field" class="space-y-2 hidden pt-2">
                <label class="text-xs font-mono text-[#c6bfff] block">PILIH AVATAR</label>
                <div class="flex justify-between gap-2" id="avatar-selector">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix&backgroundColor=7C5CFF" class="avatar-option w-14 h-14 rounded-full border-[3px] border-transparent cursor-pointer hover:scale-110 transition-all opacity-50 hover:opacity-100" data-url="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix&backgroundColor=7C5CFF">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Aneka&backgroundColor=00E5FF" class="avatar-option w-14 h-14 rounded-full border-[3px] border-transparent cursor-pointer hover:scale-110 transition-all opacity-50 hover:opacity-100" data-url="https://api.dicebear.com/7.x/adventurer/svg?seed=Aneka&backgroundColor=00E5FF">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Oliver&backgroundColor=00E676" class="avatar-option w-14 h-14 rounded-full border-[3px] border-transparent cursor-pointer hover:scale-110 transition-all opacity-50 hover:opacity-100" data-url="https://api.dicebear.com/7.x/adventurer/svg?seed=Oliver&backgroundColor=00E676">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Mia&backgroundColor=FF4081" class="avatar-option w-14 h-14 rounded-full border-[3px] border-transparent cursor-pointer hover:scale-110 transition-all opacity-50 hover:opacity-100" data-url="https://api.dicebear.com/7.x/adventurer/svg?seed=Mia&backgroundColor=FF4081">
                </div>
                <input type="hidden" id="input-avatar-url">
                <p id="avatar-error" class="text-[#FF1744] text-xs mt-1 hidden">Silakan pilih satu avatar terlebih dahulu.</p>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-4 rounded-xl bg-gradient-to-r from-[#6C5CE7] to-[#8E44AD] text-white font-bold shadow-lg hover:scale-[1.02] transition-all mt-4">
                Masuk
            </button>
        </form>

        <!-- Tombol Pengalih Mode Login / Register -->
        <div class="text-center text-sm">
            <span id="toggle-text" class="text-[#c8c4d7]">Belum punya akun?</span>
            <button id="toggle-mode" class="text-[#2edcd7] font-bold ml-1 hover:underline">Daftar sekarang</button>
        </div>
    </div>

    <!-- Script Penghubung UI -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
