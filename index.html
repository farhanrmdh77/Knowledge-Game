<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Knowledge Game</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <style>
        /* Anti Flash Putih */
        html, body { 
            background-color: #12121A !important; 
            margin: 0; 
            padding: 0;
            overflow: hidden; /* Mencegah scroll saat loading */
        }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Animasi Nafas (Breathing Glow) */
        @keyframes breath {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .animate-breath { animation: breath 3s ease-in-out infinite; }
        
        /* Animasi Melayang (Floating) */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- Efek Cahaya Latar Belakang (Glow) -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-gradient-to-tr from-[#7C5CFF] to-[#2edcd7] rounded-full blur-[100px] opacity-20 animate-breath pointer-events-none"></div>

    <!-- Konten Utama Splash Screen -->
    <div class="relative z-10 flex flex-col items-center w-full max-w-sm px-6">
        
        <!-- Ikon Logo Premium -->
        <div class="w-24 h-24 bg-[#232334]/80 backdrop-blur-xl border border-white/10 rounded-[28px] flex items-center justify-center mb-6 shadow-[0_10px_40px_rgba(124,92,255,0.3)] animate-float">
            <span class="material-symbols-outlined text-[52px] text-transparent bg-clip-text bg-gradient-to-br from-[#7C5CFF] to-[#2edcd7]" style="font-variation-settings: 'FILL' 1;">
                school
            </span>
        </div>
        
        <!-- Nama Aplikasi -->
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-white to-[#c8c4d7] tracking-tight mb-1 text-center">
            Knowledge Game
        </h1>
        
        <!-- Teks Status Loading -->
        <p id="loading-text" class="text-xs font-mono text-[#2edcd7] tracking-widest uppercase mb-10 h-4">
            Menghubungkan...
        </p>
        
        <!-- Progress Bar Elegan -->
        <div class="w-full h-1.5 bg-[#1b1b23] rounded-full overflow-hidden border border-white/5 relative shadow-inner">
            <!-- Partikel Cahaya Berjalan -->
            <div id="progress-bar" class="h-full w-0 rounded-full relative transition-all duration-[200ms] ease-out shadow-[0_0_15px_rgba(46,220,215,0.8)]" style="background: linear-gradient(90deg, #7C5CFF, #2edcd7);">
                <div class="absolute top-0 right-0 bottom-0 w-4 bg-white/40 blur-[2px]"></div>
            </div>
        </div>
        
        <!-- Persentase Angka (Opsional) -->
        <p id="progress-number" class="text-[#8E8CA7] text-[10px] font-bold mt-3">0%</p>
    </div>

    <!-- Script Logika Pemuatan & Pengecekan Akun -->
    <script type="module">
        import { auth } from './js/config/firebaseConfig.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const progressNumber = document.getElementById('progress-number');
            const loadingText = document.getElementById('loading-text');
            
            let progress = 0;
            let targetPage = 'login.html'; // Tujuan default jika belum login
            
            // 1. Firebase Mengecek Status Login di Latar Belakang
            // Pengecekan ini biasanya butuh waktu 0.5 - 1 detik
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    targetPage = 'home.html'; // Jika token login ditemukan, belokkan ke Home!
                }
            });

            // 2. Teks Loading Dinamis agar tidak membosankan
            const textStates = [
                "Menghubungkan...",
                "Memuat Modul Pelajaran...",
                "Menyinkronkan Progres...",
                "Menyiapkan Permainan..."
            ];

            // 3. Menjalankan Animasi Progress Bar Palsu (Simulasi Loading)
            const loadingInterval = setInterval(() => {
                // Tambah progress secara acak agar terlihat natural (antara 1% - 5%)
                progress += Math.floor(Math.random() * 5) + 1;
                
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);
                    
                    // Ganti teks terakhir
                    loadingText.textContent = "MEMULAI!";
                    loadingText.classList.add('text-[#7C5CFF]');
                    
                    // Efek transisi menghilang sebelum pindah halaman
                    document.body.style.transition = 'opacity 0.4s ease';
                    document.body.style.opacity = '0';
                    
                    // Pindah halaman ke hasil deteksi Firebase (login.html atau home.html)
                    setTimeout(() => {
                        window.location.href = targetPage;
                    }, 400);
                }

                // Update UI Progress
                progressBar.style.width = `${progress}%`;
                progressNumber.textContent = `${progress}%`;
                
                // Ubah teks loading berdasarkan persentase
                if (progress === 25) loadingText.textContent = textStates[1];
                if (progress === 60) loadingText.textContent = textStates[2];
                if (progress === 85) loadingText.textContent = textStates[3];

            }, 60); // Kecepatan interval (semakin kecil angkanya, semakin cepat loadingnya)
        });
    </script>
</body>
</html>
