<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop - Knowledge Game</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        background: '#121212', card: '#232236', primary: '#7C5CFF', primaryLight: '#9b82ff', 
                        textDim: '#A09FB1', success: '#00E676', warning: '#FFD600', info: '#00E5FF'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #FFFFFF; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .icon-filled { font-variation-settings: 'FILL' 1; }
        ::-webkit-scrollbar { display: none; }
    </style>
    <script src="js/utils/audioManager.js"></script>
</head>
<body class="pb-24 antialiased">

    <!-- Header -->
    <header class="sticky top-0 bg-background/90 backdrop-blur-xl z-40 px-6 py-5 border-b border-white/5 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <button onclick="window.history.back()" class="w-10 h-10 bg-card rounded-2xl flex items-center justify-center border border-white/10 hover:bg-white/5 active:scale-95 transition-all">
                <span class="material-symbols-outlined text-white">arrow_back</span>
            </button>
            <h1 class="text-xl font-extrabold">Shop</h1>
        </div>
        
        <!-- Dompet Diamond -->
        <div class="bg-card px-4 py-2 rounded-full flex items-center gap-2 border border-[#00E5FF]/30 shadow-[0_0_15px_rgba(0,229,255,0.15)]">
            <span class="material-symbols-outlined text-[#00E5FF] text-[18px] icon-filled">diamond</span>
            <span id="shop-diamond" class="font-extrabold text-sm text-white">0</span>
        </div>
    </header>

    <main class="px-6 pt-6">
        <p class="text-textDim text-sm mb-8 leading-relaxed">Gunakan Diamond Anda untuk membeli kosmetik eksklusif dan tampil paling menonjol di Papan Peringkat Global!</p>

        <!-- Kategori: Bingkai Profil -->
        <div class="mb-10">
            <h2 class="text-lg font-extrabold mb-5 flex items-center gap-2">
                <span class="material-symbols-outlined text-primary icon-filled">account_circle</span> Avatar Borders
            </h2>
            
            <!-- Grid untuk Katalog Bingkai -->
            <div id="shop-borders" class="grid grid-cols-2 gap-4">
                <p class="text-textDim text-xs col-span-2 text-center py-4 animate-pulse">Menyiapkan etalase...</p>
            </div>
        </div>

        <!-- Kategori: Gelar Kustom -->
        <div class="mb-8">
            <h2 class="text-lg font-extrabold mb-5 flex items-center gap-2">
                <span class="material-symbols-outlined text-[#FFD600] icon-filled">workspace_premium</span> Custom Titles
            </h2>
            
            <!-- List untuk Katalog Gelar -->
            <div id="shop-titles" class="flex flex-col gap-3">
                <p class="text-textDim text-xs text-center py-4 animate-pulse">Menyiapkan etalase...</p>
            </div>
        </div>
    </main>

    <script type="module" src="js/pages/shop.js"></script>
</body>
</html>
