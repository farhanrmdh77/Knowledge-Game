<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Settings - Knowledge Game</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        background: '#121212', 
                        card: '#232236', 
                        primary: '#7C5CFF', 
                        textDim: '#A09FB1' 
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #121212; color: white; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .icon-filled { font-variation-settings: 'FILL' 1; }
        ::-webkit-scrollbar { display: none; }
        .pb-safe-area-inset-bottom { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        
        /* PERBAIKAN BUG: Menggunakan FadeIn murni tanpa transform agar navigasi bawah tetap di dasar layar */
        body { animation: fadeIn 0.3s ease-out forwards; opacity: 0; min-height: 100vh; }
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }
    </style>
</head>
<body class="antialiased pb-32">

    <!-- HEADER -->
    <header class="px-6 pt-10 pb-4 sticky top-0 bg-background/90 backdrop-blur-xl z-40 flex items-center gap-4 border-b border-white/5">
        <button onclick="window.location.href='profile.html'" class="w-10 h-10 bg-card rounded-full flex items-center justify-center border border-white/10 active:scale-95 transition-transform hover:bg-white/5">
            <span class="material-symbols-outlined text-white">arrow_back</span>
        </button>
        <h1 class="text-xl font-extrabold tracking-wide">Settings</h1>
    </header>

    <main class="px-6 pt-6 space-y-8">
        
        <!-- PREFERENCES SECTION -->
        <section>
            <h3 class="text-[11px] font-black text-textDim tracking-widest uppercase mb-3 ml-2">Preferences</h3>
            
            <div class="bg-card rounded-[24px] border border-white/5 overflow-hidden shadow-lg">
                
                <!-- 1. Sound Effects -->
                <div class="flex items-center justify-between p-4 border-b border-white/5 hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-4">
                        <span class="material-symbols-outlined text-[#00E5FF] text-[22px]">volume_up</span>
                        <span class="font-bold text-sm text-white">Sound Effects</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer" checked id="toggle-sound">
                        <div class="w-11 h-6 bg-white/10 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-white/20 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)]"></div>
                    </label>
                </div>

                <!-- 2. Background Music (Dihilangkan border bawahnya agar rapi) -->
                <div class="flex items-center justify-between p-4 hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-4">
                        <span class="material-symbols-outlined text-[#00E676] text-[22px]">music_note</span>
                        <span class="font-bold text-sm text-white">Background Music</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer" id="toggle-music">
                        <div class="w-11 h-6 bg-white/10 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-white/20 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)]"></div>
                    </label>
                </div>

            </div>
        </section>

        <!-- ABOUT SECTION -->
        <section>
            <h3 class="text-[11px] font-black text-textDim tracking-widest uppercase mb-3 ml-2">About</h3>
            
            <div class="bg-card rounded-[24px] border border-white/5 overflow-hidden shadow-lg">
                
                <!-- Terms of Service -->
                <div id="menu-tos" class="flex items-center justify-between p-4 border-b border-white/5 hover:bg-white/5 transition-colors cursor-pointer active:bg-white/10">
                    <div class="flex items-center gap-4">
                        <span class="material-symbols-outlined text-textDim text-[22px]">info</span>
                        <span class="font-bold text-sm text-white">Terms of Service</span>
                    </div>
                    <span class="material-symbols-outlined text-textDim text-[18px]">chevron_right</span>
                </div>

                <!-- Privacy Policy -->
                <div id="menu-privacy" class="flex items-center justify-between p-4 border-b border-white/5 hover:bg-white/5 transition-colors cursor-pointer active:bg-white/10">
                    <div class="flex items-center gap-4">
                        <span class="material-symbols-outlined text-textDim text-[22px]">privacy_tip</span>
                        <span class="font-bold text-sm text-white">Privacy Policy</span>
                    </div>
                    <span class="material-symbols-outlined text-textDim text-[18px]">chevron_right</span>
                </div>

                <!-- App Version (Read-only) -->
                <div class="flex items-center justify-between p-4">
                    <div class="flex items-center gap-4">
                        <span class="font-bold text-sm text-textDim">App Version</span>
                    </div>
                    <span class="font-extrabold text-[13px] text-white tracking-wide">v1.3.0</span>
                </div>

            </div>
        </section>
        
    </main>

    <!-- BOTTOM NAVIGATION (Fixed) -->
    <nav class="fixed bottom-0 left-0 w-full bg-card border-t border-white/5 px-6 pt-3 pb-safe-area-inset-bottom h-[88px] rounded-t-[32px] flex justify-around items-start z-[60] shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <a href="home.html" class="flex flex-col items-center gap-1 w-16 group mt-1">
            <div class="w-10 h-10 text-textDim group-hover:text-white rounded-xl flex items-center justify-center transition-all">
                <span class="material-symbols-outlined">home</span>
            </div>
            <span class="text-[10px] font-semibold text-textDim group-hover:text-white">Home</span>
        </a>
        <a href="learn.html" class="flex flex-col items-center gap-1 w-16 group mt-1">
            <div class="w-10 h-10 text-textDim group-hover:text-white rounded-xl flex items-center justify-center transition-all">
                <span class="material-symbols-outlined">explore</span>
            </div>
            <span class="text-[10px] font-semibold text-textDim group-hover:text-white">Learn</span>
        </a>
        <a href="leaderboard.html" class="flex flex-col items-center gap-1 w-16 group mt-1">
            <div class="w-10 h-10 text-textDim group-hover:text-white rounded-xl flex items-center justify-center transition-all">
                <span class="material-symbols-outlined">emoji_events</span>
            </div>
            <span class="text-[10px] font-semibold text-textDim group-hover:text-white">Rank</span>
        </a>
        
        <!-- ACTIVE NAVIGATION: PROFILE -->
        <a href="profile.html" class="flex flex-col items-center gap-1 w-16 group">
            <div class="w-12 h-12 bg-primary/20 text-primary rounded-[18px] flex items-center justify-center transition-all shadow-[inset_0_0_12px_rgba(124,92,255,0.2)]">
                <span class="material-symbols-outlined icon-filled">person</span>
            </div>
            <span class="text-[10px] font-bold text-primary">Profile</span>
        </a>
    </nav>

    <!-- HUBUNGKAN SKRIP AUDIO GLOBAL & LOGIKA SETTINGS -->
    <script src="js/utils/audioManager.js"></script>
    <script type="module" src="js/pages/settings.js"></script>

</body>
</html>
