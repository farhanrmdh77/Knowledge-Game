<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        html, body { background-color: #121212 !important; visibility: visible !important; }
        body { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Podium Glow Animations */
        @keyframes pulseGold { 0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 214, 0, 0.4)); } 50% { filter: drop-shadow(0 0 25px rgba(255, 214, 0, 0.8)); } }
        .glow-gold { animation: pulseGold 2s infinite ease-in-out; }
        
        /* Podium Height Animations */
        @keyframes growUp { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
        .podium-bar { transform-origin: bottom; animation: growUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* Loading Spin Animation */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
    </style>

    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Leaderboard - Knowledge Game</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#121212', card: '#232236', primary: '#7C5CFF', primaryLight: '#9b82ff',
                        textDim: '#A09FB1', success: '#00E676', warning: '#FFD600',
                        rank1: '#FFD600', rank2: '#C0C0C0', rank3: '#CD7F32'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="js/utils/audioManager.js"></script>
    <style>
        body { background-color: #121212; color: #FFFFFF; -webkit-tap-highlight-color: transparent; }
        .icon-filled { font-variation-settings: 'FILL' 1; }
        ::-webkit-scrollbar { display: none; }
        .pb-safe-area-inset-bottom { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="antialiased overflow-x-hidden min-h-screen relative pb-32">

    <!-- Header -->
    <header class="px-6 pt-10 pb-4 text-center sticky top-0 bg-background/90 backdrop-blur-xl z-40 border-b border-white/5">
        <div class="w-14 h-14 mx-auto bg-gradient-to-br from-warning to-[#FF6D00] rounded-[18px] flex items-center justify-center mb-3 shadow-[0_4px_15px_rgba(255,214,0,0.3)]">
            <span class="material-symbols-outlined icon-filled text-white text-3xl">emoji_events</span>
        </div>
        <h1 class="text-2xl font-extrabold mb-1">Leaderboard</h1>
        <p class="text-textDim text-xs">Compete with friends and climb the rankings.</p>
    </header>

    <!-- Filter Tabs (Segmented Control) -->
    <section class="px-6 py-4 z-30 relative">
        <div class="bg-card rounded-2xl p-1 flex items-center border border-white/5">
            <button id="tab-global" class="flex-1 bg-[#38374A] text-white font-bold py-2.5 rounded-xl text-sm shadow-sm transition-all">
                Global
            </button>
            <button id="tab-subject" class="flex-1 text-textDim font-bold py-2.5 rounded-xl text-sm hover:text-white transition-all">
                Subject
            </button>
        </div>

        <!-- Subject Dropdown (Hidden by default) -->
        <div id="subject-filter-container" class="hidden mt-3 animate-fadeIn">
            <div class="relative">
                <select class="w-full bg-card border border-white/10 rounded-xl py-3 px-4 text-sm font-bold text-white appearance-none outline-none focus:border-primary transition-colors">
                    <option value="all">All Subjects</option>
                    <option value="mathematics">Mathematics</option>
                    <option value="science">Science</option>
                    <option value="technology">Technology</option>
                    <option value="history">History</option>
                </select>
                <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-textDim pointer-events-none">expand_more</span>
            </div>
        </div>
    </section>

    <!-- MAIN RANKING AREA -->
    <!-- Memberikan padding bottom ekstra agar bisa di-scroll melewati kartu sticky di bawah -->
    <main class="w-full px-6 pb-[200px]">
        
        <!-- TOP 3 PODIUM CONTAINER (Dikosongkan, diisi oleh JS) -->
        <section id="podium-container" class="flex justify-center items-center h-[260px] w-full mt-4">
             <!-- Animasi Loading Saat Fetching Data -->
             <div class="animate-pulse text-primary text-center">
                 <span class="material-symbols-outlined text-4xl animate-spin">autorenew</span>
                 <p class="text-[10px] mt-2 font-bold uppercase tracking-widest text-primaryLight">Sinkronisasi Server...</p>
             </div>
        </section>

        <!-- LEADERBOARD LIST CONTAINER (Rank 4+, Dikosongkan, diisi oleh JS) -->
        <section id="list-container" class="space-y-3 mt-4"></section>

    </main>

    <!-- CURRENT USER CARD (STICKY) -->
    <div class="fixed bottom-[96px] left-0 w-full px-6 z-40 pointer-events-none">
        <div class="bg-[#2a2940] p-4 rounded-[24px] flex items-center gap-4 border border-primary shadow-[0_0_25px_rgba(124,92,255,0.25)] relative overflow-hidden backdrop-blur-lg pointer-events-auto">
            <div class="absolute top-0 right-0 bg-primary text-white text-[9px] font-black px-3 py-1 rounded-bl-xl tracking-widest uppercase shadow-md">YOU</div>
            
            <span class="font-black text-primary w-5 text-center text-base">?</span>
            
            <div class="relative">
                <img src="https://ui-avatars.com/api/?name=You&background=7C5CFF&color=fff&bold=true" class="w-12 h-12 rounded-full border-2 border-primary">
            </div>
            
            <div class="flex-grow">
                <p class="font-bold text-sm text-white">My Rank</p>
                <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-[10px] font-bold text-textDim">Progres</span>
                    <div class="w-14 h-1.5 bg-black/40 rounded-full overflow-hidden">
                        <div class="h-full bg-primary w-full rounded-full shadow-[0_0_8px_rgba(124,92,255,0.6)]"></div>
                    </div>
                </div>
            </div>
            
            <div class="text-right pr-2">
                <span class="font-extrabold text-primary flex items-center justify-end gap-1 text-sm">
                    <span class="material-symbols-outlined text-[14px] icon-filled">stars</span>---
                </span>
                <span class="text-[9px] text-textDim font-bold mt-0.5 block">Tetap Berjuang!</span>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 w-full bg-card border-t border-white/5 px-6 pt-3 pb-safe-area-inset-bottom h-[88px] rounded-t-[32px] flex justify-around items-start z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <a href="home.html" class="flex flex-col items-center gap-1 w-16 group mt-1">
            <div class="w-10 h-10 text-textDim group-hover:text-white rounded-xl flex items-center justify-center transition-all">
                <span class="material-symbols-outlined">home</span>
            </div>
            <span class="text-[10px] font-semibold text-textDim group-hover:text-white">Home</span>
        </a>
        
        <a href="learn.html" class="flex flex-col items-center gap-1 w-16 group mt-1">
            <div class="w-10 h-10 text-textDim group-hover:text-white rounded-xl flex items-center justify-center transition-all">
                <span class="material-symbols-outlined">explore</span>
            </div>
            <span class="text-[10px] font-semibold text-textDim group-hover:text-white">Learn</span>
        </a>

        <!-- Rank (ACTIVE) -->
        <a href="leaderboard.html" class="flex flex-col items-center gap-1 w-16 group">
            <div class="w-12 h-12 bg-primary/20 text-primary rounded-[18px] flex items-center justify-center transition-all group-active:scale-95 shadow-[inset_0_0_12px_rgba(124,92,255,0.2)]">
                <span class="material-symbols-outlined icon-filled">emoji_events</span>
            </div>
            <span class="text-[10px] font-bold text-primary">Rank</span>
        </a>

        <a href="profile.html" class="flex flex-col items-center gap-1 w-16 group mt-1">
            <div class="w-10 h-10 text-textDim group-hover:text-white rounded-xl flex items-center justify-center transition-all">
                <span class="material-symbols-outlined">person</span>
            </div>
            <span class="text-[10px] font-semibold text-textDim group-hover:text-white">Profile</span>
        </a>
    </nav>

    <script type="module" src="js/pages/leaderboard.js"></script>
</body>
</html>
