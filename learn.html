<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Animasi Anti Kilat Putih -->
    <style>
        html, body { background-color: #121212 !important; visibility: visible !important; }
        body { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Loading Spin Animation */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
    </style>

    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Knowledge Game - Belajar</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#121212',
                        card: '#232236',
                        primary: '#7C5CFF',
                        primaryLight: '#9b82ff',
                        textDim: '#A09FB1',
                        success: '#00E676',
                        warning: '#FFD600',
                        danger: '#FF1744'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    borderRadius: {
                        '2xl': '20px',
                        '3xl': '28px',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #121212;
            color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { display: none; }
        .pb-safe-area-inset-bottom { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        
        /* Interaksi Kartu (Sekarang dikendalikan oleh JS, tapi class CSS-nya tetap kita siapkan) */
        .subject-card { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .subject-card:active { transform: scale(0.96); }
    </style>
    <script src="js/utils/audioManager.js"></script>
</head>
<body class="pb-32 antialiased">

    <!-- Header & Search -->
    <header class="px-6 pt-10 pb-6 sticky top-0 bg-background/90 backdrop-blur-xl z-40 border-b border-white/5">
        <div>
            <h1 class="text-3xl font-extrabold mb-1">Mata Pelajaran</h1>
            <p class="text-textDim text-sm">Pilih petualangan belajarmu selanjutnya.</p>
        </div>

        <!-- Search Bar -->
        <div class="flex gap-3 mt-6">
            <div class="relative flex-grow">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-textDim">search</span>
                <input type="text" id="search-input" placeholder="Cari mata pelajaran..." class="w-full bg-card rounded-2xl py-3.5 pl-12 pr-4 text-white placeholder-textDim outline-none focus:ring-2 focus:ring-primary border border-white/5 transition-all text-sm font-medium">
            </div>
            <button class="bg-card w-[52px] h-[52px] flex flex-shrink-0 items-center justify-center rounded-2xl border border-white/5 text-white hover:bg-white/5 transition-colors">
                <span class="material-symbols-outlined">tune</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT AREA (Dikosongkan untuk diisi secara dinamis oleh JavaScript) -->
    <main class="px-6 pt-4 pb-32 space-y-4" id="subjects-container">
        
        <!-- Animasi Loading Saat Fetching Data -->
        <div class="flex flex-col items-center justify-center mt-20 animate-pulse text-primary">
            <span class="material-symbols-outlined text-4xl animate-spin">autorenew</span>
            <p class="text-[10px] font-bold mt-3 uppercase tracking-widest text-primaryLight">Menyinkronkan Progres...</p>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 w-full bg-card border-t border-white/5 px-6 pt-3 pb-safe-area-inset-bottom h-[88px] rounded-t-[32px] flex justify-around items-start z-50">
        <!-- Home -->
        <a href="home.html" class="flex flex-col items-center gap-1 w-16 group mt-1">
            <div class="w-10 h-10 text-textDim group-hover:text-white rounded-xl flex items-center justify-center transition-all">
                <span class="material-symbols-outlined">home</span>
            </div>
            <span class="text-[10px] font-semibold text-textDim group-hover:text-white">Beranda</span>
        </a>
        
        <!-- Learn (ACTIVE) -->
        <a href="learn.html" class="flex flex-col items-center gap-1 w-16 group">
            <div class="w-12 h-12 bg-primary/20 text-primary rounded-[18px] flex items-center justify-center transition-all group-active:scale-95 shadow-[inset_0_0_12px_rgba(124,92,255,0.2)]">
                <span class="material-symbols-outlined icon-filled">explore</span>
            </div>
            <span class="text-[10px] font-bold text-primary">Belajar</span>
        </a>

        <!-- Rank -->
        <a href="leaderboard.html" class="flex flex-col items-center gap-1 w-16 group mt-1">
            <div class="w-10 h-10 text-textDim group-hover:text-white rounded-xl flex items-center justify-center transition-all">
                <span class="material-symbols-outlined">emoji_events</span>
            </div>
            <span class="text-[10px] font-semibold text-textDim group-hover:text-white">Peringkat</span>
        </a>

        <!-- Profile -->
        <a href="profile.html" class="flex flex-col items-center gap-1 w-16 group mt-1">
            <div class="w-10 h-10 text-textDim group-hover:text-white rounded-xl flex items-center justify-center transition-all">
                <span class="material-symbols-outlined">person</span>
            </div>
            <span class="text-[10px] font-semibold text-textDim group-hover:text-white">Profil</span>
        </a>
    </nav>

    <!-- Tambahan ?v=999 untuk mencegah cache -->
    <script type="module" src="js/pages/learn.js?v=999"></script>
</body>
</html>
